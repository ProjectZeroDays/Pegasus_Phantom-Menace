<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http://127.0.0.1:* http://localhost:*; font-src 'self' data:;" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pegasus Phantom Menace</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; height: 100vh; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0b0f0c; color: #e6f2ea;
    }
    #app { display: flex; flex-direction: column; height: 100vh; }
    header {
      display: flex; align-items: center; gap: 12px;
      padding: 8px 14px; background: #101613; border-bottom: 1px solid #1d2a22;
      -webkit-app-region: drag;
    }
    header .title { font-weight: 600; letter-spacing: .3px; }
    header .spacer { flex: 1; }
    header button, header label {
      -webkit-app-region: no-drag; font-size: 12px; color: #9fe8c0;
      background: #16211a; border: 1px solid #24362a; border-radius: 6px;
      padding: 5px 10px; cursor: pointer;
    }
    header button:hover { background: #1d2d22; }
    header input[type="checkbox"] { vertical-align: middle; }
    #status { font-size: 12px; color: #7fa88e; }
    #status.ok { color: #4ade80; }
    #status.err { color: #f87171; }
    iframe { flex: 1; border: 0; width: 100%; height: 100%; background: #fff; }
    #loading {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: #0b0f0c; color: #4ade80; font-size: 14px; letter-spacing: .5px;
    }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <span class="title">Pegasus Phantom Menace</span>
      <span class="spacer"></span>
      <span id="status">connecting…</span>
      <label><input type="checkbox" id="autostart" /> Launch at login</label>
      <button id="restart">Restart backend</button>
      <button id="open">Open in browser</button>
    </header>
    <iframe id="frame" title="Pegasus"></iframe>
  </div>
  <div id="loading">Starting Pegasus backend…</div>

  <script>
    (async function () {
      const statusEl = document.getElementById('status');
      const frame = document.getElementById('frame');
      const loading = document.getElementById('loading');
      const autostart = document.getElementById('autostart');
      const api = window.pegasus;

      function setStatus(text, cls) {
        statusEl.textContent = text;
        statusEl.className = cls || '';
      }

      // Reflect the current auto-start state.
      try {
        autostart.checked = !!(await api.getAutoStart());
      } catch (_) {}

      autostart.addEventListener('change', async () => {
        try { await api.setAutoStart(autostart.checked); } catch (_) {}
      });

      document.getElementById('restart').addEventListener('click', async () => {
        setStatus('restarting…');
        try { await api.stopBackend(); await api.startBackend(); } catch (_) {}
      });

      document.getElementById('open').addEventListener('click', async () => {
        try { await api.openExternal(await api.getBackendUrl()); } catch (_) {}
      });

      // Load the Flask backend, retrying until it answers.
      let url = 'http://127.0.0.1:5001';
      try { url = await api.getBackendUrl(); } catch (_) {}
      let tries = 0;
      const tick = setInterval(() => {
        tries++;
        fetch(url + '/api/health', { cache: 'no-store' })
          .then((r) => {
            if (!r.ok) throw new Error('bad status');
            clearInterval(tick);
            frame.src = url;
            loading.style.display = 'none';
            setStatus('online · ' + url, 'ok');
          })
          .catch(() => {
            if (tries > 60) {
              clearInterval(tick);
              loading.textContent = 'Backend did not start. Check the console.';
              setStatus('backend offline', 'err');
            } else {
              setStatus('connecting… ' + tries + 's');
            }
          });
      }, 1000);
    })();
  </script>
</body>
</html>
