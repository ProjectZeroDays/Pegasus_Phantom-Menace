<svg xmlns="http://www.w3.org/2000/svg" width="750" height="1334" viewBox="0 0 750 1334">
  <!-- iOS phone frame (Safari browser PWA view) -->
  <rect width="750" height="1334" fill="#000000" rx="40"/>
  <rect x="20" y="20" width="710" height="1294" fill="#FFFFFF" rx="30"/>
  
  <!-- Safari URL bar -->
  <rect x="40" y="50" width="670" height="44" fill="#F2F2F7" rx="22"/>
  <rect x="60" y="62" width="24" height="24" fill="#C7C7CC" rx="12"/>
  <text x="95" y="72" font-family="sans-serif" font-size="15" fill="#000000">pegasus.projectzerodays.app</text>
  <text x="620" y="72" font-family="sans-serif" font-size="15" fill="#007AFF">🔒</text>
  
  <!-- WebView content area (PWA) -->
  <rect x="40" y="110" width="670" height="1060" fill="#FFFFFF"/>
  
  <!-- Dashboard header -->
  <text x="60" y="150" font-family="sans-serif" font-weight="bold" font-size="24" fill="#FF3D00">PEGASUS</text>
  <text x="220" y="150" font-family="sans-serif" font-size="18" fill="#666666">Dashboard</text>
  
  <!-- Device agent info (browser) -->
  <rect x="60" y="180" width="630" height="120" fill="#F2F2F7" rx="12"/>
  <text x="80" y="210" font-family="monospace" font-size="14" fill="#FF3D00">Device Agent: Safari iOS 17 (WebView PWA)</text>
  <text x="80" y="235" font-family="monospace" font-size="14" fill="#666666">Remote: emulator-5554 (Android 14)  •  ADB Bridge: Active</text>
  <text x="80" y="260" font-family="monospace" font-size="14" fill="#999999">Model: iPhone 15 Pro  •  Battery: 92%  •  Storage: 128 GB</text>
  
  <!-- Quick action cards -->
  <text x="60" y="330" font-family="sans-serif" font-weight="bold" font-size="18" fill="#000000">Quick Actions</text>
  <rect x="60" y="355" width="300" height="130" fill="#F2F2F7" rx="12"/>
  <text x="80" y="385" font-family="sans-serif" font-weight="bold" font-size="16" fill="#FF3D00">Scan Network</text>
  <text x="80" y="410" font-family="sans-serif" font-size="13" fill="#666666">mDNS + TCP 5555 discovery</text>
  <rect x="380" y="355" width="300" height="130" fill="#F2F2F7" rx="12"/>
  <text x="400" y="385" font-family="sans-serif" font-weight="bold" font-size="16" fill="#FF3D00">Pair Device</text>
  <text x="400" y="410" font-family="sans-serif" font-size="13" fill="#666666">Wireless ADB pairing</text>
  
  <!-- Connected devices -->
  <text x="60" y="520" font-family="sans-serif" font-weight="bold" font-size="18" fill="#000000">Connected Devices</text>
  <rect x="60" y="545" width="630" height="90" fill="#F2F2F7" rx="12"/>
  <text x="80" y="575" font-family="sans-serif" font-weight="bold" font-size="16" fill="#34C759">● emulator-5554</text>
  <text x="80" y="600" font-family="sans-serif" font-size="13" fill="#666666">Android 14  •  API 34  •  10.0.2.15:5555</text>
  <text x="560" y="575" font-family="sans-serif" font-size="13" fill="#999999">Authorized</text>
  
  <!-- iOS-style bottom tab bar -->
  <rect x="40" y="1190" width="670" height="84" fill="#FFFFFF"/>
  <line x1="40" y1="1190" x2="710" y2="1190" stroke="#E5E5EA" stroke-width="1"/>
  <rect x="55" y="1198" width="116" height="68" fill="#FF3D00" rx="12"/>
  <text x="98" y="1222" font-family="sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">Dashboard</text>
  <rect x="187" y="1206" width="116" height="52" fill="#FFFFFF" rx="10"/>
  <text x="230" y="1228" font-family="sans-serif" font-size="12" fill="#999999" text-anchor="middle">Devices</text>
  <rect x="319" y="1206" width="116" height="52" fill="#FFFFFF" rx="10"/>
  <text x="362" y="1228" font-family="sans-serif" font-size="12" fill="#999999" text-anchor="middle">Scan</text>
  <rect x="451" y="1206" width="116" height="52" fill="#FFFFFF" rx="10"/>
  <text x="494" y="1228" font-family="sans-serif" font-size="12" fill="#999999" text-anchor="middle">Tools</text>
  <rect x="583" y="1206" width="116" height="52" fill="#FFFFFF" rx="10"/>
  <text x="626" y="1228" font-family="sans-serif" font-size="12" fill="#999999" text-anchor="middle">More</text>
</svg>
