{% extends "base.html" %}
{% block title %}Sign in · Pegasus{% endblock %}
{% block content %}
<div style="max-width:440px; margin:40px auto">
  <h1>Sign in</h1>
  <p class="lede">Demo access: <span class="mono">demo / demo</span> (no passkey).</p>
  <form method="post" class="card">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Username</label><input name="username" autocomplete="username" required autofocus>
    <label>Password</label><input name="password" type="password" autocomplete="current-password" required>
    <label>Passkey (if enrolled)</label><input name="passkey" type="password" autocomplete="off">
    <div class="row" style="margin-top:16px; justify-content:space-between">
      <button type="submit">Sign in</button>
      <a href="{{ url_for('register') }}" class="muted">Create account</a>
    </div>
  </form>
</div>
{% endblock %}
