{% extends "base.html" %}
{% block title %}Register · Pegasus{% endblock %}
{% block content %}
<div style="max-width:480px; margin:30px auto">
  <h1>Request access</h1>
  <p class="lede">Accounts are reviewed by the operator. Registration is only submitted once; you will be notified after approval.</p>
  <form method="post" class="card">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Username</label><input name="username" required autofocus>
    <label>Email</label><input name="email" type="email" required>
    <label>Password (min 4 characters)</label><input name="password" type="password" required>
    <label>USDC wallet you will pay from (0x…)</label><input name="wallet" placeholder="0x0000000000000000000000000000000000000000">
    <label>What are you testing?</label><textarea name="note" rows="3" placeholder="Devices, campaign context, timeline…"></textarea>
    <div class="row" style="margin-top:16px; justify-content:space-between">
      <button type="submit">Submit request</button>
      <a href="{{ url_for('login') }}" class="muted">Already have an account</a>
    </div>
  </form>
</div>
{% endblock %}
