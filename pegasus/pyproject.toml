[project]
name = "pegasus-phantom-menace"
version = "2.0.0"
description = "Android Device Management & Security Audit Platform"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "ProjectZeroDays", email = "projectzerodays@example.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "rich>=13.7.0",
    "click>=8.1.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pyyaml>=6.0",
    "rich-cli>=1.0.0",
    "pymetasploit3>=1.0.3",
    "anthropic>=0.25.0",
    "qrcode>=7.4.2",
    "pillow>=10.0.0",
    "requests>=2.31.0",
    "aiohttp>=3.9.0",
    "asyncssh>=2.14.0",
    "paramiko>=3.4.0",
    "python-nmap>=0.7.1",
    "scapy>=2.5.0",
    "cryptography>=41.0.0",
    "pyjwt>=2.8.0",
    "passlib>=1.7.4",
    "bcrypt>=4.1.0",
    "pyotp>=2.9.0",
    "websockets>=12.0",
    "fastapi>=0.108.0",
    "uvicorn>=0.25.0",
    "jinja2>=3.1.0",
    "weasyprint>=60.0",
    "pydantic-extra-types>=2.4.0",
    "watchdog>=3.0.0",
    "psutil>=5.9.0",
    "sqlite-utils>=3.37.0",
    "alembic>=1.13.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.19.0",
    "redis>=5.0.0",
    "celery>=5.3.0",
    "flower>=2.0.0",
    "prometheus-client>=0.19.0",
    "structlog>=24.1.0",
    "loguru>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-xdist>=3.5.0",
    "pytest-html>=4.1.0",
    "pytest-benchmark>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "pre-commit>=3.6.0",
    "bandit>=1.7.0",
    "semgrep>=1.60.0",
    "playwright>=1.40.0",
    "pytest-playwright>=0.4.0",
]
frida = ["frida-tools>=12.0.0", "frida>=16.0.0"]
lockknife = ["lockknife @ git+https://github.com/ImKKingshuk/LockKnife@main"]
full = ["pegasus-phantom-menace[frida,lockknife]"]

[project.urls]
Homepage = "https://github.com/ProjectZeroDays/Pegasus_Phantom-Menace"
Repository = "https://github.com/ProjectZeroDays/Pegasus_Phantom-Menace"
Issues = "https://github.com/ProjectZeroDays/Pegasus_Phantom-Menace/issues"
Documentation = "https://pegasus-phantom-menace.readthedocs.io"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["pegasus_v2*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["pegasus_v2/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --strict-config --tb=short"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow tests",
    "frida: Requires Frida",
    "metasploit: Requires Metasploit RPC",
    "adb: Requires ADB device",
]

[tool.ruff]
line-length = 120
target-version = "py311"
select = ["E", "F", "I", "UP", "B", "C4", "PTH", "SIM", "T20", "ARG", "PL", "TRY", "NPY", "RSE", "RET", "FLY", "TD", "PT", "ISC", "ICN", "PIE", "TCH", "INT", "ERA", "PD", "PGH", "FUR", "NPY"]
ignore = ["E501", "B008", "C901"]
per-file-ignores = {
    "tests/*": ["S101", "S106"],
    "pegasus_v2/tests/*": ["S101", "S106"],
}

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
implicit_reexport = true
strict_equality = true
no_implicit_optional = true
warn_unreachable = true
strict_optional = true

[tool.coverage.run]
source = ["pegasus_v2"]
omit = ["*/tests/*", "*/migrations/*", "*/scripts/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "def __repr__", "raise NotImplementedError", "if __name__ == .__main__.:", "if TYPE_CHECKING:"]
precision = 2

[tool.bandit]
exclude_dirs = ["tests", ".venv", "build", "dist"]
skips = ["B101", "B601", "B603", "B607"]

[tool.semgrep]
config = "auto"

[tool.pytest-cov]
append = true
report = ["term-missing", "html", "xml"]
xml = "coverage.xml"

[tool.setuptools.package-dir]
"" = "pegasus_v2"