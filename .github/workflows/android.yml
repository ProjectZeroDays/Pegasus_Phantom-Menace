name: Android APK

on:
  push:
    branches: [main]
    paths: ["pegasus-mobile/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pegasus-mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Build debug + release APKs
        run: ./gradlew assembleDebug assembleRelease

      - name: Decode release keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.properties

      - uses: actions/upload-artifact@v4
        with:
          name: pegasus-apks
          path: |
            pegasus-mobile/app/build/outputs/apk/debug/app-debug.apk
            pegasus-mobile/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
