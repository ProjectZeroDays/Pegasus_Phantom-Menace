name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: python -c "import pegasus.ui.web.backend.app"
      - run: pytest -q -m "not live"
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python scripts/verify.py
      - run: pytest -q tests/test_carriers.py tests/test_parity.py tests/test_grammar.py
      - run: pytest -q tests/test_beacon_auth.py
      - name: exemptions intact
        run: |
          python - <<'EOF'
          import pegasus.ui.web.backend.app as a
          assert "/api/setup" in a.EXEMPT
          assert "/api/ai/status" in a.EXEMPT
          assert "/api/autonomous" not in a.EXEMPT
          EOF
